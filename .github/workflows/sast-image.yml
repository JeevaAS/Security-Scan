name: SAST Image Build, Scan and Push

on:

  push:
    branches:
      - main
    paths:
      - 'sonarqube/**'
      - 'SonarQube/**'
      - 'Sonar Qube/**'
      - 'sonar/**'
      - 'coverity/**'
      - 'Coverity/**'
      - 'blackduck/**'
      - 'script/**'
      - '.github/workflows/sast-image.yml'

  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:

  # Local Docker Registry
  # Set this in repository secrets to push to Docker Hub / Artifactory. Default falls back to localhost:5000 for local testing.
  REGISTRY: ${{ secrets.REGISTRY_HOST || 'localhost:5000' }}

  # Docker image tag
  IMAGE_TAG: ${{ github.sha }}


jobs:

  # ==========================================================
  # DETECT WHICH FOLDER CHANGED
  # ==========================================================

  changes:

    name: Detect Changed SAST Folder

    runs-on: ubuntu-latest

    outputs:

      sonar: ${{ steps.filter.outputs.sonar }}

      coverity: ${{ steps.filter.outputs.coverity }}

      blackduck: ${{ steps.filter.outputs.blackduck }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Login to registry
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Debug registry & images
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          echo "REGISTRY=${REGISTRY}"
          docker --version || true
          docker info || true
          echo "Local images:"
          docker image ls || true
          if [ -f built-image-id.txt ]; then echo "built-image-id:"; cat built-image-id.txt; fi

      - name: Debug registry & images
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          echo "REGISTRY=${REGISTRY}"
          docker --version || true
          docker info || true
          echo "Local images:"
          docker image ls || true
          if [ -f built-image-id.txt ]; then echo "built-image-id:"; cat built-image-id.txt; fi

      - name: Debug registry & images
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          echo "REGISTRY=${REGISTRY}"
          docker --version || true
          docker info || true
          echo "Local images:"
          docker image ls || true
          if [ -f built-image-id.txt ]; then echo "built-image-id:"; cat built-image-id.txt; fi
      - name: Debug registry & images
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        shell: bash
        run: |
          echo "REGISTRY=${REGISTRY}"
          docker --version || true
          docker info || true
          echo "Local images:"
          docker image ls || true
          if [ -f built-image-id.txt ]; then echo "built-image-id:"; cat built-image-id.txt; fi
      # registry login intentionally omitted here; login performed in build/push jobs where required


      - name: Detect folder changes

        id: filter

        uses: dorny/paths-filter@v3

        with:

          filters: |

            sonar:
              - 'Sonar Qube/**'
              - 'sonarqube/**'
              - 'SonarQube/**'
              - 'sonar/**'
              - 'Sonar/**'
              - 'sonar*'
              - 'sonar/**/Dockerfile'
              - 'sonar/**/build.sh'

            coverity:
              - 'Coverity/**'
              - 'coverity/**'
              - 'Coverity/**/Dockerfile'
              - 'coverity/**/Dockerfile'
              - 'coverity/**/build.sh'
              - 'coverity*'

            blackduck:
              - 'Black Duck/**'
              - 'blackduck/**'
              - 'BlackDuck/**'
              - 'Blackduck/**'
              - 'blackduck*'
              - 'blackduck/**/Dockerfile'
              - 'blackduck/**/build.sh'


  # ==========================================================
  # SONAR IMAGE
  # ==========================================================

  sonar:

    name: SonarQube SAST Image

    needs: changes

    if: |
      needs.changes.outputs.sonar == 'true' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.scanner == 'sonar' ||
          inputs.scanner == 'all'
        )
      )

    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Docker connectivity
      # ------------------------------------------------------

      - name: Docker connectivity test

        shell: bash

        run: |

          echo "=========================================="
          echo "Docker Connectivity Test"
          echo "=========================================="

          docker version

          if [ $? -ne 0 ]; then
            echo "ERROR: Docker is not available"
            exit 1
          fi

          echo "Docker connectivity successful."


      # ------------------------------------------------------
      # Local Docker Registry
      # ------------------------------------------------------

      - name: Local registry connectivity

        shell: bash

        run: |

          echo "=========================================="
          echo "Local Registry Connectivity"
          echo "=========================================="

          response=$(curl -s http://localhost:5000/v2/ || true)

          if [ "$response" = "{}" ]; then
            echo "Registry responded: $response"
          else
            echo "Registry not reachable at localhost:5000 — starting a temporary registry container for CI testing"
            docker run -d -p 5000:5000 --name registry registry:2 || true
            # wait up to 15s for registry to come up
            for i in $(seq 1 15); do
              response=$(curl -s http://localhost:5000/v2/ || true)
              if [ "$response" = "{}" ]; then
                echo "Registry started and responding"
                break
              fi
              sleep 1
            done
            if [ "$response" != "{}" ]; then
              echo "ERROR: Registry still not reachable after starting local registry"
              # continue so we can collect logs later, but exit with non-zero to fail the job
              exit 7
            fi
          fi

          echo "Registry connectivity check complete."


      # ------------------------------------------------------
      # Trivy availability
      # ------------------------------------------------------

      - name: Ensure Trivy is installed

        shell: bash

        run: |
          echo "=========================================="
          echo "Ensure Trivy is installed"
          echo "=========================================="
          if command -v trivy >/dev/null 2>&1; then
            echo "trivy found: $(trivy --version | head -n1)"
          else
            echo "trivy not found — installing..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
            echo "installed: $(trivy --version | head -n1)"
          fi

      - name: Login to registry
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Install Trivy (if missing)

        shell: bash

        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            echo "Installing trivy..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          else
            echo "trivy already installed"
          fi

      - name: Login to registry
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}


      # ------------------------------------------------------
      # Build Docker Image
      # ------------------------------------------------------

      - name: Build SonarQube image

        shell: bash

        run: |

          echo "=========================================="
          echo "Building SonarQube Image"
          echo "=========================================="

          # find sonar directory (case-insensitive) and run build
          TARGET_DIR="sonar"
          if [ ! -d "${TARGET_DIR}" ]; then
            for alt in sonarqube "Sonar Qube" sonar SonarQube; do
              if [ -d "$alt" ]; then TARGET_DIR="$alt"; break; fi
            done
          fi
          if [ ! -d "${TARGET_DIR}" ]; then
            echo "Error: sonar directory not found"
            exit 1
          fi
          cd "${TARGET_DIR}"
          chmod +x build.sh
          ./build.sh

          # verify image exists locally and push coverity image to registry so scanners can access it
          echo "Verifying built image: ${REGISTRY}/sast-coverity:${IMAGE_TAG}"
          if ! docker image inspect "${REGISTRY}/sast-coverity:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Warning: image not found locally with registry tag; attempting to find local image by image name"
            if docker image inspect "sast-coverity:${IMAGE_TAG}" >/dev/null 2>&1; then
              docker tag "sast-coverity:${IMAGE_TAG}" "${REGISTRY}/sast-coverity:${IMAGE_TAG}" || true
            elif [ -f built-image-id.txt ]; then
              echo "Tagging built image by ID from built-image-id.txt"
              docker tag "$(cat built-image-id.txt)" "${REGISTRY}/sast-coverity:${IMAGE_TAG}"
            fi
          fi

          

          echo "Pushing image to registry: ${REGISTRY}/sast-coverity:${IMAGE_TAG}"
          docker push "${REGISTRY}/sast-coverity:${IMAGE_TAG}"

          # verify image exists locally and push sonar image to registry so scanners can access it
          echo "Verifying built image: ${REGISTRY}/sast-sonarqube:${IMAGE_TAG}"
          if ! docker image inspect "${REGISTRY}/sast-sonarqube:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Warning: image not found locally with registry tag; attempting to find local image by image name"
            # attempt to tag local image if present
            if docker image inspect "sast-sonarqube:${IMAGE_TAG}" >/dev/null 2>&1; then
              docker tag "sast-sonarqube:${IMAGE_TAG}" "${REGISTRY}/sast-sonarqube:${IMAGE_TAG}" || true
            elif [ -f built-image-id.txt ]; then
              echo "Tagging built image by ID from built-image-id.txt"
              docker tag "$(cat built-image-id.txt)" "${REGISTRY}/sast-sonarqube:${IMAGE_TAG}"
            fi
          fi

          

          echo "Pushing image to registry: ${REGISTRY}/sast-sonarqube:${IMAGE_TAG}"
          docker push "${REGISTRY}/sast-sonarqube:${IMAGE_TAG}"


      # ------------------------------------------------------
      # Trivy Scan
      # ------------------------------------------------------

      - name: Trivy vulnerability scan

        shell: bash

        run: |

          echo "=========================================="
          echo "Trivy Security Scan"
          echo "=========================================="

          chmod +x Script/trivy.sh

          ./Script/trivy.sh \
            "${REGISTRY}/sast-sonarqube:${IMAGE_TAG}"

      - name: List Trivy output files for debugging

        if: always()

        shell: bash

        run: |
          echo "Listing files in workspace:"
          ls -la
          echo "Listing potential Trivy outputs:"
          ls -la trivy-*.json trivy-*.txt trivy-summary.md || true


      # ------------------------------------------------------
      # Publish Trivy result to GitHub Summary
      # ------------------------------------------------------

      - name: Publish Trivy summary

        if: always()

        shell: bash

        run: |

          if [ -f trivy-summary.md ]; then

            cat trivy-summary.md >> "$GITHUB_STEP_SUMMARY"

          fi


      # ------------------------------------------------------
      # Upload Trivy reports
      # ------------------------------------------------------

      - name: Upload Trivy reports

        if: always()

        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

        with:

          name: sonar-trivy-report-${{ github.sha }}

          path: |

            trivy-results.json

            trivy-results.txt

            trivy-summary.md

          retention-days: 7


  # ==========================================================
  # COVERITY IMAGE
  # ==========================================================

  coverity:

    name: Coverity SAST Image

    needs: changes

    if: |
      needs.changes.outputs.coverity == 'true' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.scanner == 'coverity' ||
          inputs.scanner == 'all'
        )
      )

    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Docker connectivity test

        shell: bash

        run: |

          docker version


      - name: Local registry connectivity

        shell: bash

        run: |

          echo "Checking local registry at http://localhost:5000/v2/"
          response=$(curl -s http://localhost:5000/v2/ || true)
          if [ "$response" = "{}" ]; then
            echo "Registry responded: $response"
          else
            echo "Registry not reachable — starting temporary registry"
            docker run -d -p 5000:5000 --name registry registry:2 || true
            for i in $(seq 1 15); do
              response=$(curl -s http://localhost:5000/v2/ || true)
              if [ "$response" = "{}" ]; then
                echo "Registry started and responding"
                break
              fi
              sleep 1
            done
            if [ "$response" != "{}" ]; then
              echo "ERROR: Registry still not reachable"
              exit 7
            fi
          fi

          echo "Registry connectivity check complete."


      - name: Ensure Trivy is installed

        shell: bash

        run: |
          echo "Ensuring trivy is installed"
          if command -v trivy >/dev/null 2>&1; then
            echo "trivy found: $(trivy --version | head -n1)"
          else
            echo "trivy not found — installing..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
            echo "installed: $(trivy --version | head -n1)"
          fi
      - name: Install Trivy (if missing)

        shell: bash

        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            echo "Installing trivy..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          else
            echo "trivy already installed"
          fi


      - name: Build Coverity image

        shell: bash

        run: |

          # find coverity directory (case-insensitive) and run build
          TARGET_DIR="coverity"
          if [ ! -d "${TARGET_DIR}" ]; then
            for alt in coverity Coverity; do
              if [ -d "$alt" ]; then TARGET_DIR="$alt"; break; fi
            done
          fi
          if [ ! -d "${TARGET_DIR}" ]; then
            echo "Error: coverity directory not found"
            exit 1
          fi
          cd "${TARGET_DIR}"
          chmod +x build.sh
          ./build.sh


      - name: Trivy vulnerability scan

        shell: bash

        run: |

          chmod +x Script/trivy.sh

          ./Script/trivy.sh \
            "${REGISTRY}/sast-coverity:${IMAGE_TAG}"

      - name: List Trivy output files for debugging

        if: always()

        shell: bash

        run: |
          echo "Listing files in workspace:"
          ls -la
          echo "Listing potential Trivy outputs:"
          ls -la trivy-*.json trivy-*.txt trivy-summary.md || true


      - name: Publish Trivy summary

        if: always()

        shell: bash

        run: |

          if [ -f trivy-summary.md ]; then

            cat trivy-summary.md >> "$GITHUB_STEP_SUMMARY"

          fi


      - name: Upload Trivy reports

        if: always()

        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

        with:

          name: coverity-trivy-report-${{ github.sha }}

          path: |

            trivy-results.json

            trivy-results.txt

            trivy-summary.md

          retention-days: 7


  # ==========================================================
  # BLACKDUCK IMAGE
  # ==========================================================

  blackduck:

    name: Black Duck SAST Image

    needs: changes

    if: |
      needs.changes.outputs.blackduck == 'true' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.scanner == 'blackduck' ||
          inputs.scanner == 'all'
        )
      )

    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Docker connectivity test

        shell: bash

        run: |

          docker version


      - name: Local registry connectivity

        shell: bash

        run: |

          echo "Checking local registry at http://localhost:5000/v2/"
          response=$(curl -s http://localhost:5000/v2/ || true)
          if [ "$response" = "{}" ]; then
            echo "Registry responded: $response"
          else
            echo "Registry not reachable — starting temporary registry"
            docker run -d -p 5000:5000 --name registry registry:2 || true
            for i in $(seq 1 15); do
              response=$(curl -s http://localhost:5000/v2/ || true)
              if [ "$response" = "{}" ]; then
                echo "Registry started and responding"
                break
              fi
              sleep 1
            done
            if [ "$response" != "{}" ]; then
              echo "ERROR: Registry still not reachable"
              exit 7
            fi
          fi

          echo "Registry connectivity check complete."


      - name: Ensure Trivy is installed

        shell: bash

        run: |
          echo "Ensuring trivy is installed"
          if command -v trivy >/dev/null 2>&1; then
            echo "trivy found: $(trivy --version | head -n1)"
          else
            echo "trivy not found — installing..."
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
            echo "installed: $(trivy --version | head -n1)"
          fi


      - name: Build Black Duck image

        shell: bash

        env:
          DETECT_URL: ${{ secrets.DETECT_URL }}
        run: |

          # find blackduck directory (case-insensitive and common variants) and run build
          TARGET_DIR="blackduck"
          if [ ! -d "${TARGET_DIR}" ]; then
            for alt in blackduck "Black Duck" BlackDuck; do
              if [ -d "$alt" ]; then TARGET_DIR="$alt"; break; fi
            done
          fi
          if [ ! -d "${TARGET_DIR}" ]; then
            echo "Error: blackduck directory not found"
            exit 1
          fi
          cd "${TARGET_DIR}"
          chmod +x build.sh

          if [ -z "${DETECT_URL:-}" ]; then
            echo "DETECT_URL is not set — build script will attempt to use any detect.jar in ${TARGET_DIR} or create a placeholder."
          else
            echo "DETECT_URL is set — build script will download detect.jar"
          fi

          ./build.sh

          # verify image exists locally so scanners can access it (do not push yet)
          echo "Verifying built image: ${REGISTRY}/sast-blackduck:${IMAGE_TAG}"
          if ! docker image inspect "${REGISTRY}/sast-blackduck:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Warning: image not found locally with registry tag; attempting to find local image by name"
          fi
          # ensure image is tagged with registry and push so it's available to other jobs
          if ! docker image inspect "${REGISTRY}/sast-blackduck:${IMAGE_TAG}" >/dev/null 2>&1; then
            if docker image inspect "sast-blackduck:${IMAGE_TAG}" >/dev/null 2>&1; then
              docker tag "sast-blackduck:${IMAGE_TAG}" "${REGISTRY}/sast-blackduck:${IMAGE_TAG}" || true
            elif [ -f built-image-id.txt ]; then
              echo "Tagging built image by ID from built-image-id.txt"
              docker tag "$(cat built-image-id.txt)" "${REGISTRY}/sast-blackduck:${IMAGE_TAG}"
            fi
          fi
          
          echo "Pushing image to registry: ${REGISTRY}/sast-blackduck:${IMAGE_TAG}"
          docker push "${REGISTRY}/sast-blackduck:${IMAGE_TAG}"
          


      - name: Trivy vulnerability scan
        shell: bash
        run: |
          echo "Running Trivy scan for Black Duck image"
          chmod +x Script/trivy.sh
          ./Script/trivy.sh "${REGISTRY}/sast-blackduck:${IMAGE_TAG}"

      - name: List Trivy output files for debugging

        if: always()

        shell: bash

        run: |
          echo "Listing files in workspace:"
          ls -la
          echo "Listing potential Trivy outputs:"
          ls -la trivy-*.json trivy-*.txt trivy-summary.md || true


      - name: Publish Trivy summary

        if: always()

        shell: bash

        run: |

          if [ -f trivy-summary.md ]; then

            cat trivy-summary.md >> "$GITHUB_STEP_SUMMARY"

          fi


      - name: Upload Trivy reports

        if: always()

        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

        with:

          name: blackduck-trivy-report-${{ github.sha }}

          path: |

            trivy-results.json

            trivy-results.txt

            trivy-summary.md

          retention-days: 7


  # ==========================================================
  # MANUAL APPROVAL
  # ==========================================================

  approval:

    name: Manual Security Approval

    needs:

      - sonar
      - coverity
      - blackduck

    if: |
      always() &&
      (
        needs.sonar.result == 'success' ||
        needs.coverity.result == 'success' ||
        needs.blackduck.result == 'success'
      )

    runs-on: ubuntu-latest

    environment:

      name: sast-production

    steps:

      - name: Security approval completed

        shell: bash

        run: |

          echo "=========================================="
          echo "SAST SECURITY APPROVAL"
          echo "=========================================="

          echo "Trivy scan completed."
          echo "Manual approval received."
          echo "Images can now be pushed."


  # ==========================================================
  # PUSH SONAR IMAGE
  # ==========================================================

  push-sonar:

    name: Push SonarQube Image

    needs:

      - sonar
      - approval

    if: |
      needs.sonar.result == 'success' &&
      needs.approval.result == 'success'

    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Push SonarQube image

        shell: bash

        run: |

          TARGET_DIR="sonar"
          if [ ! -d "${TARGET_DIR}" ]; then
            for alt in sonarqube "Sonar Qube" sonar SonarQube; do
              if [ -d "$alt" ]; then TARGET_DIR="$alt"; break; fi
            done
          fi
          if [ ! -d "${TARGET_DIR}" ]; then
            echo "Error: sonar directory not found"
            exit 1
          fi
          cd "${TARGET_DIR}"

          

          chmod +x push.sh
          ./push.sh


  # ==========================================================
  # PUSH COVERITY IMAGE
  # ==========================================================

  push-coverity:

    name: Push Coverity Image

    needs:

      - coverity
      - approval

    if: |
      needs.coverity.result == 'success' &&
      needs.approval.result == 'success'

    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Login to registry
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Push Coverity image

        shell: bash

        run: |

          TARGET_DIR="coverity"
          if [ ! -d "${TARGET_DIR}" ]; then
            for alt in coverity Coverity; do
              if [ -d "$alt" ]; then TARGET_DIR="$alt"; break; fi
            done
          fi
          if [ ! -d "${TARGET_DIR}" ]; then
            echo "Error: coverity directory not found"
            exit 1
          fi
          cd "${TARGET_DIR}"
          

          chmod +x push.sh
          ./push.sh


  # ==========================================================
  # PUSH BLACKDUCK IMAGE
  # ==========================================================

  push-blackduck:

    name: Push Black Duck Image

    needs:

      - blackduck
      - approval

    if: |
      needs.blackduck.result == 'success' &&
      needs.approval.result == 'success'

    runs-on: ubuntu-latest
    env:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Login to registry
        if: ${{ env.REGISTRY_USERNAME && env.REGISTRY_PASSWORD }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}


      - name: Push Black Duck image

        shell: bash

        run: |

          TARGET_DIR="blackduck"
          if [ ! -d "${TARGET_DIR}" ]; then
            for alt in blackduck "Black Duck" BlackDuck; do
              if [ -d "$alt" ]; then TARGET_DIR="$alt"; break; fi
            done
          fi
          if [ ! -d "${TARGET_DIR}" ]; then
            echo "Error: blackduck directory not found"
            exit 1
          fi
          cd "${TARGET_DIR}"
          chmod +x push.sh
          ./push.sh